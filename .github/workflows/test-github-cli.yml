name: Comment when opened using GitHub CLI

on:
  pull_request:
  workflow_dispatch: 

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: View PR details
        run: gh pr comment $PULL_REQUEST_NUMBER --body "Hi from GitHub CLI"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      - run: |
         echo "$GITHUB_BASE_REF"
          echo "$GITHUB_HEAD_REF"
      - name: call local composite action
        id: callcom
        uses: ./actions/setup
      - name: get outputs
        run: echo ${{ steps.callcom.outputs.version}}