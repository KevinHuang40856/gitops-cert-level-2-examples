

on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  matrix-job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pet: [cat, dog]
        color: [pink, brown]
        include:
          - behavi: block
          - pet: pig
          - color: blue
         # - pet: cat
         #   color: pink
    steps:
      - name: Set the value
        id: step_one
        run: |
         echo "action_state=yellow" >> "$GITHUB_ENV"
      - name: Use the value
        id: step_two
        run: echo "print variable $action_state "
