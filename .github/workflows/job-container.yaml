name: CI-jobcontainer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  container-test-job:
    runs-on: ubuntu-latest
    container:
      image: ubuntu
      env:
        NODE_ENV: development
      ports:
        - 80
      volumes:
        - my_docker_volume:/volume_mount
      options: --cpus 1
    steps:
      - name: Check for dockerenv file
        run: (ls /.dockerenv && echo Found dockerenv) || (echo No dockerenv)
      - run: echo "myenv=env.NODE_ENV">> "$GITHUB_ENV"
      - run: echo "my ENV IS $myenv"
      
